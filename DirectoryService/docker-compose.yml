services:
  directory_service_db:
    image: postgres:16-alpine
    restart: unless-stopped
    container_name: postgres_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: DirectoryService  
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-default-net

volumes:
  postgres_data:
    name: directory_service_postgres_data
networks:
  app-default-net:
    driver: bridge
    name: directory_service_network